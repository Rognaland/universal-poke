name: CI — E2E with Secrets (docker compose)

on:
  workflow_dispatch: {}
  push:
    branches: [ main, master ]

jobs:
  e2e-with-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU and buildx (for Docker)
        uses: docker/setup-buildx-action@v2

      - name: Ensure docker-compose v2 available
        run: docker compose version

      - name: Create env file from GitHub secrets
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIZE_DISTRIBUTOR: ${{ secrets.PRIZE_DISTRIBUTOR }}
          FUND_SENDER_PK: ${{ secrets.FUND_SENDER_PK }}
          DEBUG_TOKEN: ${{ secrets.DEBUG_TOKEN }}
          ALLOW_DEBUG: ${{ secrets.ALLOW_DEBUG || 'false' }}
        run: |
          set -eux
          cat > .env.ci <<EOF
          RPC_URL=http://hardhat:8545
          PRIVATE_KEY=${PRIVATE_KEY}
          PRIZE_DISTRIBUTOR=${PRIZE_DISTRIBUTOR}
          FUND_SENDER_PK=${FUND_SENDER_PK}
          DEBUG_TOKEN=${DEBUG_TOKEN}
          ALLOW_DEBUG=${ALLOW_DEBUG}
          EOF

      - name: Run deploy + E2E runner using .env.ci
        run: |
          mkdir -p artifacts
          # Pass secrets into docker compose via --env-file; this avoids putting secrets in the workflow logs
          docker compose --env-file .env.ci up --exit-code-from runner --build

      - name: Collect docker-compose logs
        if: always()
        run: |
          mkdir -p artifacts
          docker compose logs --no-color > artifacts/docker-compose.log || true
          docker ps -a --filter "name=runner" --format "{{.ID}}" | xargs -r docker logs 2>/dev/null > artifacts/runner.log || true
          if [ -f deployments/local.json ]; then cp deployments/local.json artifacts/local-deploy.json; fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: artifacts
