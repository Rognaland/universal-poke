name: CI — E2E (docker compose)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU and buildx (for Docker)
        uses: docker/setup-buildx-action@v2

      - name: Ensure docker-compose v2 available
        run: docker compose version

      - name: Run deploy + E2E runner
        env:
          # keep defaults used locally; override in repository secrets if needed
          RPC_URL: http://hardhat:8545
        run: |
          mkdir -p artifacts
          # Build and run the runner service; exit with the runner's exit code
          docker compose up --exit-code-from runner --build

      - name: Collect docker-compose logs
        if: always()
        run: |
          mkdir -p artifacts
          docker compose logs --no-color > artifacts/docker-compose.log || true
          # collect runner logs specifically
          docker logs $(docker ps -a --filter "name=runner" --format "{{.ID}}") 2>/dev/null > artifacts/runner.log || true
          # gather deployment output if present
          if [ -f deployments/local.json ]; then cp deployments/local.json artifacts/local-deploy.json; fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: artifacts
